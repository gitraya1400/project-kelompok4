version: '3.8'

services:

  db-master:
    image: mysql:8.0
    container_name: db-master
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: RootPass123!
      MYSQL_DATABASE: klinik_db
    volumes:
      - ./config/mysql-master.cnf:/etc/mysql/conf.d/master.cnf
      - ./sql:/docker-entrypoint-initdb.d
    networks:
      - dbnet

  db-slave:
    image: mysql:8.0
    container_name: db-slave
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: RootPass123!
    volumes:
      - ./config/mysql-slave.cnf:/etc/mysql/conf.d/slave.cnf
    networks:
      - dbnet
    depends_on:
      - db-master

  haproxy:
    image: haproxy:2.8
    container_name: haproxy
    restart: always
    ports:
      - "3300:3300"
      - "8404:8404"
    volumes:
      - ./config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
    networks:
      - dbnet
    depends_on:
      - db-master
      - db-slave

networks:
  dbnet:
    driver: bridge